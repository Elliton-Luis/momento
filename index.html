<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Visualizador minimalista da rotina atual. Abra, veja o que deveria estar fazendo, feche." />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3ead9" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1120" />
  <title>Momento — o que eu deveria estar fazendo agora?</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    try {
      var storedTheme = localStorage.getItem("momento.theme.v1");
      if (storedTheme === "light" || storedTheme === "dark") document.documentElement.dataset.theme = storedTheme;
    } catch (error) { /* storage unavailable: follow the system theme */ }
  </script>
</head>
<body>
  <main class="page">
    <!-- Main view: deliberately empty, shows only the current moment -->
    <section id="main-view" aria-label="Atividade atual">
      <div class="main-top">
        <button class="theme-toggle" type="button" aria-label="Alternar para modo escuro">☾</button>
      </div>

      <div class="main-center">
        <p id="clock" class="clock" aria-label="Hora atual">--:--:--</p>

        <div id="current-block" class="current-block" aria-live="polite"></div>

        <div id="next-block" class="next-block" aria-live="polite"></div>
      </div>

      <nav class="actions">
        <button id="go-manage" class="link-button" type="button">Cadastrar rotina</button>
      </nav>
    </section>

    <!-- Manage view: simple administration of the full routine -->
    <section id="manage-view" aria-label="Gerenciar rotina" hidden>
      <header class="manage-header">
        <button id="go-main" class="link-button" type="button">← Voltar</button>
        <h1 class="manage-title">Rotina</h1>
        <button class="theme-toggle" type="button" aria-label="Alternar para modo escuro">☾</button>
      </header>

      <ul id="routine-list" class="routine-list"></ul>

      <form id="activity-form" class="activity-form" novalidate>
        <h2 id="form-title" class="form-title">Nova atividade</h2>
        <div class="form-row">
          <label class="field">
            <span>Início</span>
            <input id="field-start" type="time" required />
          </label>
          <label class="field">
            <span>Fim</span>
            <input id="field-end" type="time" required />
          </label>
        </div>
        <label class="field">
          <span>Nome</span>
          <input id="field-name" type="text" maxlength="80" placeholder="Ex.: Estudo profundo" required />
        </label>
        <label class="field">
          <span>Descrição (opcional)</span>
          <input id="field-description" type="text" maxlength="200" placeholder="Detalhe curto, se precisar" />
        </label>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button id="form-cancel" class="ghost-button" type="button" hidden>Cancelar</button>
          <button class="primary-button" type="submit">Salvar</button>
        </div>
      </form>

      <section class="transfer" aria-label="Importar e exportar rotina">
        <h2 class="form-title">Importar / Exportar</h2>
        <p class="transfer-hint">Markdown ou TXT seguem o formato documentado no README. JSON usa o formato exportado pelo próprio aplicativo.</p>
        <div class="transfer-actions">
          <button id="import-text" class="ghost-button" type="button">Importar Markdown/TXT</button>
          <button id="import-json" class="ghost-button" type="button">Importar JSON</button>
          <button id="export-json" class="ghost-button" type="button">Exportar JSON</button>
        </div>
        <input id="import-file" type="file" accept=".md,.markdown,.txt,.json,text/plain,application/json" hidden />
        <p id="transfer-message" class="transfer-message" role="status" hidden></p>
      </section>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
